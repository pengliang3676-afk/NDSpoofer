name: Build NDSpoofer
on:
  push:
    branches: ["**"]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and verify release with Xcode
        run: bash scripts/build_release_xcode.sh
      - uses: actions/upload-artifact@v4
        with:
          name: NDSpoofer-10.22.04
          path: |
            dist/M-10.22.04.dylib
            dist/X-10.22.04.deb
            dist/NDSpoofer_10.22.04.dylib
            dist/NDSpooferCraneManager_10.22.04_RootHide.deb
            dist/ndspoofer_config.plist
            dist/SHA256SUMS.txt
